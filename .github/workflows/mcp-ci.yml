name: MCP CI

on:
  push:
    paths:
      - "finam_mcp/**"
      - "marketdata/**"
      - "app/**"
      - "requirements.txt"
      - "Dockerfile"
      - "tests/**"
      - "requirements-mcp*.txt"
      - "Dockerfile.mcp"
      - "deploy/finam-mcp/**"
      - ".github/workflows/mcp-ci.yml"
  pull_request:
    paths:
      - "finam_mcp/**"
      - "marketdata/**"
      - "app/**"
      - "requirements.txt"
      - "Dockerfile"
      - "tests/**"
      - "requirements-mcp*.txt"
      - "Dockerfile.mcp"
      - "deploy/finam-mcp/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-mcp-dev.txt -r requirements.txt
      - run: ruff format --check finam_mcp marketdata app/market*.py tests
      - run: ruff check finam_mcp marketdata app/market*.py tests
      - run: mypy finam_mcp
      - run: pytest -q
        env:
          FINAM_TEST_PG_URL: postgresql://postgres@localhost:${{ job.services.postgres.ports[5432] }}/postgres
      - run: python -m compileall -q finam_mcp
      - run: pip-audit -r requirements-mcp.txt
      - run: docker compose -f deploy/finam-mcp/docker-compose.yml --env-file deploy/finam-mcp/.env.example config --quiet

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          tags: finam-mcp:ci
          push: false
          load: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finam-mcp:ci
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
