<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Market Data</title>
<style>
:root{color-scheme:dark;--bg:#0b0f14;--panel:#121821;--line:#253140;--text:#e8edf3;--muted:#8e9bab;--good:#3ddc97;--bad:#ff6b6b;--accent:#73a7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1500px;margin:auto;padding:24px}.header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:13px}.controls{display:flex;gap:8px;flex-wrap:wrap}
select,button{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:9px}
button{cursor:pointer}button.active{border-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:20px 0}
.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.card{padding:14px}.panel{padding:14px;margin-top:12px}
.label{font-size:12px;color:var(--muted)}.value{font-size:20px;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
canvas{width:100%;display:block}.price{height:500px}.volume{height:170px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.status{font-size:12px;color:var(--muted)}.ok{color:var(--good)}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.price{height:350px}}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <div><h1>Market Data</h1><div class="sub">FINAM live · MOEX history · PostgreSQL</div></div>
  <div class="controls">
    <select id="instrument"></select>
    <select id="interval">
      <option value="1m">1 мин</option><option value="5m">5 мин</option>
      <option value="15m" selected>15 мин</option><option value="1h">1 час</option>
      <option value="4h">4 часа</option><option value="1d">1 день</option>
    </select>
    <button data-range="1">1D</button><button data-range="7">7D</button><button data-range="30">1M</button><button data-range="0" class="active">С июня</button>
  </div>
</div>
<div class="cards">
  <div class="card"><div class="label">Последняя цена</div><div class="value" id="last">—</div></div>
  <div class="card"><div class="label">Изменение периода</div><div class="value" id="change">—</div></div>
  <div class="card"><div class="label">Максимум</div><div class="value" id="high">—</div></div>
  <div class="card"><div class="label">Минимум</div><div class="value" id="low">—</div></div>
  <div class="card"><div class="label">Объём последней свечи</div><div class="value" id="vol">—</div></div>
</div>
<div class="panel"><div class="row"><strong>OHLC</strong><span class="status" id="priceStatus"></span></div><canvas id="price" class="price"></canvas></div>
<div class="panel"><div class="row"><strong>Объём</strong><span class="status" id="backfill"></span></div><canvas id="volume" class="volume"></canvas></div>
</div>
<script>
const $=id=>document.getElementById(id);let rangeDays=0,currentBars=[];
function resize(c){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.floor(r.width*d);c.height=Math.floor(r.height*d);return{ctx:c.getContext('2d'),w:c.width,h:c.height,d}}
function fmt(n,d=2){return Number(n).toLocaleString('ru-RU',{maximumFractionDigits:d})}
function xPos(i,n,w,p){return p+(n<2?0:i/(n-1)*(w-2*p))}
function yPos(v,mn,mx,h,p){return h-p-(v-mn)/(mx-mn||1)*(h-2*p)}
function timeLabel(ts){
  const dt=new Date(ts);
  const time=dt.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  const date=dt.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});
  if(rangeDays===1)return time;
  if(rangeDays>1&&rangeDays<=7)return date+' '+time;
  return date;
}
function drawTimeAxis(ctx,b,w,h,d,p){
  if(!b.length)return;
  const ticks=Math.min(7,b.length),labelY=h-8*d;
  ctx.font=(11*d)+'px system-ui';
  ctx.fillStyle='#8e9bab';
  ctx.strokeStyle='#253140';
  ctx.lineWidth=d;
  for(let t=0;t<ticks;t++){
    const i=ticks===1?0:Math.round(t*(b.length-1)/(ticks-1));
    const x=xPos(i,b.length,w,p);
    ctx.beginPath();ctx.moveTo(x,p);ctx.lineTo(x,h-p);ctx.stroke();
    ctx.textAlign=t===0?'left':(t===ticks-1?'right':'center');
    ctx.fillText(timeLabel(b[i].timestamp),x,labelY);
  }
  ctx.textAlign='left';
}
function priceChart(){
  const c=$('price'),{ctx,w,h,d}=resize(c),b=currentBars;ctx.clearRect(0,0,w,h);if(!b.length)return;
  const p=48*d,mn=Math.min(...b.map(x=>+x.low)),mx=Math.max(...b.map(x=>+x.high)),step=(w-2*p)/Math.max(1,b.length-1),bw=Math.max(1*d,Math.min(8*d,step*.7));
  ctx.strokeStyle='#253140';ctx.lineWidth=d;
  for(let i=0;i<5;i++){const y=p+i*(h-2*p)/4;ctx.beginPath();ctx.moveTo(p,y);ctx.lineTo(w-p,y);ctx.stroke()}
  b.forEach((z,i)=>{const x=xPos(i,b.length,w,p),o=+z.open,cl=+z.close,hi=+z.high,lo=+z.low,up=cl>=o,color=up?'#3ddc97':'#ff6b6b';
    const yh=yPos(hi,mn,mx,h,p),yl=yPos(lo,mn,mx,h,p),yo=yPos(o,mn,mx,h,p),yc=yPos(cl,mn,mx,h,p);
    ctx.strokeStyle=color;ctx.lineWidth=d;ctx.beginPath();ctx.moveTo(x,yh);ctx.lineTo(x,yl);ctx.stroke();
    ctx.fillStyle=color;const top=Math.min(yo,yc),bh=Math.max(1*d,Math.abs(yc-yo));ctx.fillRect(x-bw/2,top,bw,bh);
  });
  ctx.fillStyle='#8e9bab';ctx.font=(11*d)+'px system-ui';ctx.fillText(fmt(mx),4*d,p);ctx.fillText(fmt(mn),4*d,h-p);
  drawTimeAxis(ctx,b,w,h,d,p);
}
function volumeChart(){
  const c=$('volume'),{ctx,w,h,d}=resize(c),b=currentBars;ctx.clearRect(0,0,w,h);if(!b.length)return;
  const p=22*d,v=b.map(x=>+x.volume||0),mx=Math.max(...v)||1,step=(w-2*p)/Math.max(1,v.length-1),bw=Math.max(1*d,Math.min(8*d,step*.75));
  b.forEach((z,i)=>{const val=+z.volume||0,x=xPos(i,b.length,w,p),bh=val/mx*(h-2*p);ctx.fillStyle=(+z.close>=+z.open)?'rgba(61,220,151,.55)':'rgba(255,107,107,.55)';ctx.fillRect(x-bw/2,h-p-bh,bw,bh)});
  drawTimeAxis(ctx,b,w,h,d,p);
}
async function load(){
  const symbol=$('instrument').value;if(!symbol)return;const interval=$('interval').value,end=new Date(),start=rangeDays?new Date(end-rangeDays*86400000):new Date('2026-06-01T00:00:00+03:00');
  $('priceStatus').textContent='загрузка…';const u=new URL('/api/candles',location.origin);
  u.searchParams.set('symbol',symbol);u.searchParams.set('timeframe','TIME_FRAME_M1');u.searchParams.set('interval',interval);u.searchParams.set('start',start.toISOString());u.searchParams.set('end',end.toISOString());u.searchParams.set('max_points','5000');
  const r=await fetch(u),j=await r.json();currentBars=j.bars||[];const b=currentBars;
  if(b.length){const f=+b[0].open,l=+b[b.length-1].close,ch=(l/f-1)*100;$('last').textContent=fmt(l);$('change').textContent=(ch>=0?'+':'')+fmt(ch)+'%';$('change').style.color=ch>=0?'#3ddc97':'#ff6b6b';$('high').textContent=fmt(Math.max(...b.map(x=>+x.high)));$('low').textContent=fmt(Math.min(...b.map(x=>+x.low)));$('vol').textContent=fmt(b[b.length-1].volume,0);$('priceStatus').textContent=symbol+' · '+interval+' · '+b.length.toLocaleString('ru-RU')+' свечей · '+new Date(b[b.length-1].timestamp).toLocaleString('ru-RU')}
  priceChart();volumeChart();
}
async function init(){
  const i=await(await fetch('/api/instruments')).json();i.instruments.forEach(x=>{const o=document.createElement('option');o.value=x.symbol;o.textContent=x.symbol.replace('@MISX','').replace('@RTSX','');$('instrument').appendChild(o)});
  $('instrument').onchange=load;$('interval').onchange=load;
  document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-range]').forEach(x=>x.classList.remove('active'));b.classList.add('active');rangeDays=+b.dataset.range;if(rangeDays===1)$('interval').value='1m';if(rangeDays===0&&$('interval').value==='1m')$('interval').value='15m';load()});
  setInterval(async()=>{try{const s=await(await fetch('/backfill/status')).json();$('backfill').textContent=s.status==='done'?'История с июня загружена':'Backfill: '+s.status+' · '+(s.current||'');$('backfill').className='status '+(s.status==='done'?'ok':'')}catch(e){}},3000);
  await load();setInterval(load,30000);
}
window.addEventListener('resize',()=>{priceChart();volumeChart()});init();
</script>
</body>
</html>
